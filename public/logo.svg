<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hintergrund-Verlauf: Schiefer-Anthrazit -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Warmes Bernstein- bis Goldlicht -->
    <linearGradient id="lightWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#E09F3E" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Zarter Glüh-Effekt -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="dropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Abgerundeter App-Icon Hintergrund -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtiler konzentrischer Schutzring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#F59E0B" stroke-opacity="0.05" stroke-width="1.5" />

  <!-- Äußerer Glow der vertikalen Lichtleiter-Welle -->
  <path d="M 256 64
           C 256 120, 280 150, 280 200
           C 280 250, 232 280, 232 330
           C 232 370, 256 395, 256 410"
        fill="none"
        stroke="#F59E0B"
        stroke-width="14"
        stroke-linecap="round"
        stroke-opacity="0.35"
        filter="url(#glow)" />

  <!-- Haupt-Lichtleiter-Strom (Sanfte S-Kurve von oben nach unten) -->
  <path d="M 256 64
           C 256 120, 280 150, 280 200
           C 280 250, 232 280, 232 330
           C 232 370, 256 395, 256 410"
        fill="none"
        stroke="url(#lightWave)"
        stroke-width="6"
        stroke-linecap="round" />

  <!-- Innerer reiner Lichtfaden -->
  <path d="M 256 64
           C 256 120, 280 150, 280 200
           C 280 250, 232 280, 232 330
           C 232 370, 256 395, 256 410"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-opacity="0.9" />

  <!-- Licht-Quelle oben (kleiner feiner Einstrom-Punkt) -->
  <circle cx="256" cy="64" r="5" fill="#FFFBEB" filter="url(#glow)" />

  <!-- Warmer Leuchtpunkt & Tropfen unten am Ende der Versorgungsleitung -->
  <circle cx="256" cy="416" r="32" fill="url(#dropGlow)" />
  <circle cx="256" cy="416" r="16" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="256" cy="416" r="8" fill="#FFFBEB" />
</svg>
